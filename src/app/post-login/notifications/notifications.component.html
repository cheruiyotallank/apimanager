<div *ngIf="isOpen" class="notifications-modal-backdrop" (click)="closeNotifications()">
  <div class="notifications-modal-card" (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <div class="notifications-header">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <div class="notifications-icon-box">
            <i class="bi bi-bell-fill"></i>
          </div>
          <div>
            <h4 class="mb-0 fw-bold">Notifications</h4>
            <small class="text-muted">{{ unreadCount }} unread</small>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-primary rounded-pill" (click)="markAllAsRead()" *ngIf="unreadCount > 0">
            <i class="bi bi-check-all me-1"></i> Mark all read
          </button>
          <button class="btn-close" (click)="closeNotifications()"></button>
        </div>
      </div>
    </div>

    <!-- Notifications List -->
    <div class="notifications-body">
      <div *ngFor="let notification of notifications" 
           class="notification-item" 
           [class.unread]="!notification.read"
           (click)="markAsRead(notification)">
        
        <div class="notification-content">
          <div class="d-flex align-items-start gap-3">
            <div class="notification-type-icon">
              <i [ngClass]="getNotificationIconClass(notification.type)"></i>
            </div>
            <div class="flex-grow-1">
              <div class="d-flex align-items-center justify-content-between mb-1">
                <h6 class="fw-bold mb-0">{{ notification.title }}</h6>
                <small class="text-muted">{{ notification.timestamp }}</small>
              </div>
              <p class="text-muted mb-0">{{ notification.message }}</p>
            </div>
          </div>
        </div>
        
        <div *ngIf="!notification.read" class="unread-indicator"></div>
      </div>

      <!-- Empty State -->
      <div *ngIf="notifications.length === 0" class="empty-notifications">
        <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
        <p class="text-muted">No notifications</p>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="notifications-footer">
      <button class="btn btn-outline-secondary rounded-pill w-100" (click)="closeNotifications()">
        Close
      </button>
    </div>

  </div>
</div>
